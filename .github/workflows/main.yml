name: Build Kivy Android APK In Debug Mode
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libgl1-mesa-dev libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Build APK with Buildozer
        run: |
          export BUILDODER_ALLOW_PLATFORM_EXEC=1
          export USE_COLORS=0
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Check if APK was built
        id: check-build
        run: |
          echo "====打印当前目录===="
          pwd
          echo "====打印bin目录内容===="
          ls -la ./bin/ || echo "bin文件夹不存在"
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
            echo "===✅找到APK文件==="
            ls -la bin/*.apk
            stat bin/*.apk
          else
            echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
            echo "===❌bin目录内未生成APK文件==="
          fi

      # 没有任何if条件，强制执行上传
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            buildozer.log
          retention-days: 7
